<style>
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:#00e5c7;color:#050a0e}
html{scroll-behavior:smooth}
body{background:#050a0e;color:#e8f0f2;font-family:'DM Mono',monospace;overflow-x:hidden}

/* Grid Background */
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,229,199,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,199,0.03) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridPulse 8s ease-in-out infinite}
@keyframes gridPulse{0%,100%{opacity:.5}50%{opacity:1}}

/* Glow Orbs */
.glow-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;animation:orbFloat 20s ease-in-out infinite}
.glow-orb-1{width:400px;height:400px;background:rgba(0,229,199,0.06);top:10%;left:-5%;animation-delay:0s}
.glow-orb-2{width:350px;height:350px;background:rgba(0,229,199,0.04);top:50%;right:-8%;animation-delay:-7s}
.glow-orb-3{width:300px;height:300px;background:rgba(0,180,160,0.05);bottom:10%;left:30%;animation-delay:-14s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-40px) scale(1.05)}50%{transform:translate(-20px,30px) scale(.95)}75%{transform:translate(40px,20px) scale(1.02)}}

/* Particles */
.particle{position:absolute;width:2px;height:2px;background:#00e5c7;border-radius:50%;opacity:0;animation:particleFloat linear infinite}
@keyframes particleFloat{0%{opacity:0;transform:translateY(0) scale(0)}10%{opacity:.6;transform:scale(1)}90%{opacity:.3}100%{opacity:0;transform:translateY(-100vh) scale(.5)}}

/* Glitch Effect */
.glitch-wrap{position:relative;display:inline-block}
.glitch-main{position:relative;z-index:2}
.glitch-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.glitch-a{animation:glitchA 4s infinite linear;color:#00e5c7;clip-path:polygon(0 0,100% 0,100% 35%,0 35%)}
.glitch-b{animation:glitchB 4s infinite linear;color:#ff3366;clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%)}
@keyframes glitchA{0%,92%,100%{transform:translate(0)}93%{transform:translate(-3px,1px)}95%{transform:translate(3px,-1px)}97%{transform:translate(-2px,2px)}}
@keyframes glitchB{0%,90%,100%{transform:translate(0)}91%{transform:translate(3px,-1px)}94%{transform:translate(-3px,1px)}96%{transform:translate(2px,-2px)}}

/* Reveal Animations */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-left{opacity:0;transform:translateX(-40px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal-left.visible{opacity:1;transform:translateX(0)}
.reveal-right{opacity:0;transform:translateX(40px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal-right.visible{opacity:1;transform:translateX(0)}
.reveal-scale{opacity:0;transform:scale(.9);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal-scale.visible{opacity:1;transform:scale(1)}

/* Hero Entrance */
.hero-title{animation:heroIn 1.2s cubic-bezier(.16,1,.3,1) both}
.hero-sub{animation:heroIn 1.2s cubic-bezier(.16,1,.3,1) .3s both}
.hero-desc{animation:heroIn 1.2s cubic-bezier(.16,1,.3,1) .5s both}
.hero-stats{animation:heroIn 1.2s cubic-bezier(.16,1,.3,1) .7s both}
.hero-cta{animation:heroIn 1.2s cubic-bezier(.16,1,.3,1) .9s both}
@keyframes heroIn{0%{opacity:0;transform:translateY(50px) scale(.97);filter:blur(8px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}

/* Card 3D Tilt */
.tilt-card{transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s ease,border-color .4s ease;transform-style:preserve-3d;will-change:transform}
.tilt-card:hover{border-color:rgba(0,229,199,.3)!important}

/* Sonar Pulse */
.sonar{position:relative}
.sonar::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;border:1px solid rgba(0,229,199,.4);transform:translate(-50%,-50%);animation:sonarPing 3s ease-out infinite;pointer-events:none}
@keyframes sonarPing{0%{width:0;height:0;opacity:1}100%{width:120px;height:120px;opacity:0}}

/* SVG Draw */
.svg-draw path,.svg-draw line,.svg-draw circle,.svg-draw rect,.svg-draw polyline,.svg-draw polygon{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.5s cubic-bezier(.16,1,.3,1)}
.svg-draw.visible path,.svg-draw.visible line,.svg-draw.visible circle,.svg-draw.visible rect,.svg-draw.visible polyline,.svg-draw.visible polygon{stroke-dashoffset:0}

/* Scanning Line */
.scan-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,199,.4),transparent);animation:scanDown 4s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes scanDown{0%{top:-2px;opacity:0}5%{opacity:1}95%{opacity:1}100%{top:calc(100% + 2px);opacity:0}}

/* Tab Content */
.tab-content{transition:opacity .3s ease,transform .3s ease}
.tab-content.entering{opacity:0;transform:translateY(10px)}
.tab-content.active{opacity:1;transform:translateY(0)}

/* Copy Feedback */
.copy-btn{transition:all .3s ease}
.copy-btn.copied{background:#00e5c7!important;color:#050a0e!important}

/* Nav Glass */
.nav-glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .3s ease,border-color .3s ease}

/* Custom Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#050a0e}
::-webkit-scrollbar-thumb{background:#1a2d3a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#00e5c7}

/* Comparison highlight */
.compare-highlight{background:rgba(0,229,199,.05);border-left:3px solid #00e5c7}

/* Accent underline animation */
.accent-line{height:2px;background:linear-gradient(90deg,transparent,#00e5c7,transparent);animation:lineGlow 3s ease-in-out infinite}
@keyframes lineGlow{0%,100%{opacity:.3;transform:scaleX(.5)}50%{opacity:1;transform:scaleX(1)}}

/* Breathing border */
.breathe-border{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{border-color:rgba(0,229,199,.1)}50%{border-color:rgba(0,229,199,.25)}}

/* Electron orbit */
.orbit-system{position:relative;width:260px;height:260px;margin:0 auto 24px}
.orbit-core{position:absolute;top:50%;left:50%;width:180px;height:180px;transform:translate(-50%,-50%);border-radius:50%;z-index:2}
.orbit-core img{width:100%;height:100%;border-radius:50%;animation:coreGlow 3s ease-in-out infinite}
@keyframes coreGlow{0%,100%{filter:drop-shadow(0 0 20px rgba(0,229,199,.3)) drop-shadow(0 0 60px rgba(0,229,199,.15))}50%{filter:drop-shadow(0 0 30px rgba(0,229,199,.5)) drop-shadow(0 0 80px rgba(0,229,199,.25))}}
.orbit-ring{position:absolute;top:50%;left:50%;width:160px;height:160px;border:1.5px solid rgba(0,229,199,.18);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 15px rgba(0,229,199,.08),inset 0 0 15px rgba(0,229,199,.05)}
.electron{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;z-index:3}
.electron img{width:100%;height:100%;border-radius:50%;box-shadow:0 0 8px rgba(0,229,199,.7),0 0 20px rgba(0,229,199,.3);animation:ePulse 2s ease-in-out infinite}
@keyframes ePulse{0%,100%{box-shadow:0 0 8px rgba(0,229,199,.5),0 0 15px rgba(0,229,199,.2)}50%{box-shadow:0 0 12px rgba(0,229,199,.9),0 0 30px rgba(0,229,199,.4)}}
.electron::after{content:'';position:absolute;inset:-5px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,199,.25),transparent 70%)}
.e1{animation:orbitA 6s linear infinite;animation-delay:0s}
.e2{animation:orbitB 8s linear infinite;animation-delay:-1s}
.e3{animation:orbitC 5s linear infinite;animation-delay:-2s}
.e4{animation:orbitD 9s linear infinite;animation-delay:-3s}
.e5{animation:orbitE 7s linear infinite;animation-delay:-4s}
.e6{animation:orbitF 10s linear infinite;animation-delay:-5s}
.e7{animation:orbitG 6.5s linear infinite;animation-delay:-1.5s}
@keyframes orbitA{0%{transform:rotate(0deg) translateX(80px) rotate(0deg)}100%{transform:rotate(360deg) translateX(80px) rotate(-360deg)}}
@keyframes orbitB{0%{transform:rotate(90deg) translateX(80px) rotate(-90deg)}100%{transform:rotate(450deg) translateX(80px) rotate(-450deg)}}
@keyframes orbitC{0%{transform:rotate(180deg) translateX(80px) rotate(-180deg)}100%{transform:rotate(540deg) translateX(80px) rotate(-540deg)}}
@keyframes orbitD{0%{transform:rotate(270deg) translateX(80px) rotate(-270deg)}100%{transform:rotate(630deg) translateX(80px) rotate(-630deg)}}
@keyframes orbitE{0%{transform:rotate(45deg) translateX(80px) rotate(-45deg)}100%{transform:rotate(405deg) translateX(80px) rotate(-405deg)}}
@keyframes orbitF{0%{transform:rotate(135deg) translateX(80px) rotate(-135deg)}100%{transform:rotate(495deg) translateX(80px) rotate(-495deg)}}
@keyframes orbitG{0%{transform:rotate(225deg) translateX(80px) rotate(-225deg)}100%{transform:rotate(585deg) translateX(80px) rotate(-585deg)}}

/* Typing cursor */
.typing-cursor::after{content:'_';animation:blink 1s step-end infinite;color:#00e5c7}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Phone mockup */
.phone-mockup{position:relative;border-radius:24px;overflow:hidden;border:2px solid rgba(0,229,199,0.15);box-shadow:0 0 60px rgba(0,229,199,0.12),0 20px 60px rgba(0,0,0,0.5);animation:heroIn 1.2s cubic-bezier(.16,1,.3,1) .5s both}
.phone-mockup img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(to bottom,rgba(0,229,199,0.15) 0%,black 10%,black 85%,transparent 100%);mask-image:linear-gradient(to bottom,rgba(0,229,199,0.15) 0%,black 10%,black 85%,transparent 100%)}
.phone-tilt{transform:perspective(800px) rotateY(-8deg) rotateX(3deg);border-color:rgba(0,229,199,0.25);box-shadow:0 0 50px rgba(0,229,199,0.18),-15px 25px 60px rgba(0,0,0,0.6);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.phone-tilt:hover{transform:perspective(800px) rotateY(-2deg) rotateX(1deg)}

/* Phone contour glow */
@property --phone-glow{syntax:'<angle>';initial-value:0deg;inherits:false}
.phone-glow-wrap{position:relative;display:inline-block}
.phone-glow-wrap::before{content:'';position:absolute;inset:-4px;border-radius:28px;z-index:10;pointer-events:none;
  background:conic-gradient(from var(--phone-glow,0deg),transparent 0%,transparent 5%,rgba(0,229,199,.7) 7%,#00e5c7 9%,rgba(0,229,199,.7) 11%,transparent 13%,transparent 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:3px;
  animation:phoneContourGlow 3s linear infinite}
.phone-glow-wrap::after{content:'';position:absolute;inset:-8px;border-radius:32px;z-index:9;pointer-events:none;
  background:conic-gradient(from var(--phone-glow,0deg),transparent 0%,transparent 3%,rgba(0,229,199,.35) 6%,rgba(0,229,199,.5) 9%,rgba(0,229,199,.35) 12%,transparent 15%,transparent 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:10px;filter:blur(6px);
  animation:phoneContourGlow 3s linear infinite}
@keyframes phoneContourGlow{to{--phone-glow:360deg}}

/* Phone scan line */
.phone-scan::before{content:'';position:absolute;left:0;right:0;height:60px;z-index:10;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,229,199,.07),transparent);
  animation:phoneScan 4s ease-in-out infinite}
.phone-scan::after{content:'';position:absolute;left:0;right:0;height:2px;z-index:11;pointer-events:none;
  background:linear-gradient(90deg,transparent 5%,rgba(0,229,199,.6) 25%,#00e5c7 50%,rgba(0,229,199,.6) 75%,transparent 95%);
  box-shadow:0 0 10px 1px rgba(0,229,199,.4),0 0 30px 3px rgba(0,229,199,.12);
  animation:phoneScan 4s ease-in-out infinite}
@keyframes phoneScan{0%{top:-2px;opacity:0}4%{opacity:1}88%{opacity:.9}94%{opacity:0}100%{top:calc(100% + 2px);opacity:0}}

/* Mouse glow follower */
.mouse-glow{position:fixed;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,199,.06) 0%,transparent 70%);pointer-events:none;z-index:1;transform:translate(-50%,-50%);transition:left .3s ease,top .3s ease}

/* Toast */
.toast{animation:toastIn .4s cubic-bezier(.16,1,.3,1) both}
@keyframes toastIn{0%{opacity:0;transform:translateY(20px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.toast-out{animation:toastOut .3s ease both}
@keyframes toastOut{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
</style>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

/* ─── Hooks ─── */
function useInView(opts={}){
  const ref=useRef(null);
  const[visible,setVisible]=useState(false);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVisible(true);if(!opts.repeat)obs.unobserve(el)}},opts);
    obs.observe(el);return()=>obs.disconnect();
  },[]);
  return[ref,visible];
}

function useScrollY(){
  const[y,setY]=useState(0);
  useEffect(()=>{const h=()=>setY(window.scrollY);window.addEventListener('scroll',h,{passive:true});return()=>window.removeEventListener('scroll',h)},[]);
  return y;
}

function useCounter(end,duration=2000,start=0){
  const[val,setVal]=useState(start);
  const[ref,vis]=useInView();
  useEffect(()=>{
    if(!vis)return;let st=null;
    const step=ts=>{if(!st)st=ts;const p=Math.min((ts-st)/duration,1);setVal(Math.floor(start+(end-start)*p));if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  },[vis,end,duration,start]);
  return[val,ref];
}

/* ─── Reveal Wrapper ─── */
function Reveal({children,delay=0,direction='up',className='',repeat=false}){
  const[ref,vis]=useInView({threshold:.1,repeat});
  const cls=direction==='left'?'reveal-left':direction==='right'?'reveal-right':direction==='scale'?'reveal-scale':'reveal';
  return<div ref={ref} className={`${cls} ${vis?'visible':''} ${className}`} style={{transitionDelay:`${delay}ms`}}>{children}</div>;
}

/* ─── Particle Field ─── */
function ParticleField(){
  const particles=useMemo(()=>Array.from({length:20},(_,i)=>({
    id:i,left:`${Math.random()*100}%`,animDur:`${8+Math.random()*12}s`,delay:`${Math.random()*10}s`,size:`${1+Math.random()*2}px`,opacity:.2+Math.random()*.4
  })),[]);
  return<div className="fixed inset-0 z-0 pointer-events-none overflow-hidden">
    {particles.map(p=><div key={p.id} className="particle" style={{left:p.left,bottom:'-10px',width:p.size,height:p.size,animationDuration:p.animDur,animationDelay:p.delay,opacity:p.opacity}}/>)}
  </div>;
}

/* ─── Mouse Glow ─── */
function MouseGlow(){
  const[pos,setPos]=useState({x:-500,y:-500});
  useEffect(()=>{
    const h=e=>setPos({x:e.clientX,y:e.clientY});
    window.addEventListener('mousemove',h);return()=>window.removeEventListener('mousemove',h);
  },[]);
  return<div className="mouse-glow hidden lg:block" style={{left:pos.x,top:pos.y}}/>;
}

/* ─── Toast ─── */
function Toast({message,onDone}){
  const[out,setOut]=useState(false);
  useEffect(()=>{const t1=setTimeout(()=>setOut(true),2000);const t2=setTimeout(()=>onDone(),2400);return()=>{clearTimeout(t1);clearTimeout(t2)}},[]);
  return<div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-lg bg-bz-card border border-bz-accent/30 text-bz-accent font-mono text-sm ${out?'toast-out':'toast'}`}>{message}</div>;
}

/* ─── 3D Tilt Card ─── */
function TiltCard({children,className=''}){
  const cardRef=useRef(null);
  const handleMove=useCallback(e=>{
    const c=cardRef.current;if(!c)return;
    const r=c.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    c.style.transform=`perspective(800px) rotateY(${x*8}deg) rotateX(${-y*8}deg) scale(1.02)`;
  },[]);
  const handleLeave=useCallback(()=>{
    const c=cardRef.current;if(!c)return;
    c.style.transform='perspective(800px) rotateY(0) rotateX(0) scale(1)';
  },[]);
  return<div ref={cardRef} className={`tilt-card ${className}`} onMouseMove={handleMove} onMouseLeave={handleLeave}>{children}</div>;
}
