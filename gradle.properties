# Project-wide Gradle settings

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AGP 9.x requires JDK 21+ (system default JDK 22 used)

# Use parallel execution for faster builds
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Configure on-demand configuration
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# Non-transitive R classes for smaller APKs
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Enable Gradle configuration cache (Kotlin 2.0+)
org.gradle.configuration-cache=true

# Suppress compileSdk 35 warning with AGP 9.x
android.suppressUnsupportedCompileSdk=35

# Allow KSP to register generated sources via kotlin.sourceSets (needed until KSP uses android.sourceSets)
android.disallowKotlinSourceSets=false
